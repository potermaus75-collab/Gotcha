<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#151925">

  <title>수집 육성 게임</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div id="app">

    <!-- 상단 정보 -->
    <header class="top-bar">
      <div class="player-info">
        <strong>Lv.1 초보 모험가</strong>
      </div>

      <div class="currency-list">
        <span>🪙 <b id="gold">1000</b></span>
        <span>💎 <b id="gem">500</b></span>
      </div>
    </header>

    <!-- 화면이 표시되는 영역 -->
    <main class="screen-container">

      <section id="home-screen" class="screen active">
        <h1>홈</h1>

        <div class="main-card">
          <p>수집과 육성의 세계에 오신 것을 환영합니다.</p>
          <button id="daily-reward-button" class="primary-button">
            출석 보상 받기
          </button>
        </div>
      </section>

      <section id="character-screen" class="screen">
        <h1>캐릭터</h1>

        <div class="empty-message">
          아직 보유한 캐릭터가 없습니다.
        </div>
      </section>

      <section id="gacha-screen" class="screen">
        <h1>가챠</h1>

        <div class="main-card gacha-banner">
          <h2>일반 소환</h2>
          <p>새로운 캐릭터를 획득하세요.</p>

          <button class="primary-button">
            1회 소환 · 💎 100
          </button>
        </div>
      </section>

      <section id="battle-screen" class="screen">
        <h1>전투</h1>

        <div class="main-card">
          <h2>스테이지 1-1</h2>
          <p>권장 전투력: 100</p>

          <button class="primary-button">
            전투 시작
          </button>
        </div>
      </section>

    </main>

    <!-- 하단 메뉴 -->
    <nav class="bottom-nav">
      <button class="nav-button active" data-screen="home-screen">
        <span class="nav-icon">🏠</span>
        <span>홈</span>
      </button>

      <button class="nav-button" data-screen="character-screen">
        <span class="nav-icon">🧙</span>
        <span>캐릭터</span>
      </button>

      <button class="nav-button" data-screen="gacha-screen">
        <span class="nav-icon">✨</span>
        <span>가챠</span>
      </button>

      <button class="nav-button" data-screen="battle-screen">
        <span class="nav-icon">⚔️</span>
        <span>전투</span>
      </button>
    </nav>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
